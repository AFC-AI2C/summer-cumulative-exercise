# Pre-commit hooks configuration for Python projects
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML files
      - id: check-json
        name: Check JSON files
      - id: check-toml
        name: Check TOML files
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-docstring-first
        name: Check docstring is first
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Check for mixed line endings
        args: ['--fix=lf']

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3
        files: ^web_app/

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ["--profile", "black"]
        files: ^web_app/

  # Python linting with pylint (modern, fast linter)
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.7 # Use the desired version of Pylint
    hooks:
      - id: pylint
        args:
          - --rcfile=web_app/.pylintrc
          - -j=0
        files: ^web_app/


  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy
        files: ^web_app/
        args: [--config-file=web_app/mypy.ini]
        additional_dependencies: [types-requests, fastapi]

  # Python testing with pytest
  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: 1.0.0 # Use the latest version or tag
    hooks:
    - id: pytest
      pass_filenames: false
      always_run: true
      args: [-c, web_app/pytest.ini]
      additional_dependencies: [requests, fastapi]
